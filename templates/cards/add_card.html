{% extends 'base.html' %}

{% block title %}Add Card | CardVault Pro{% endblock %}

{% block content %}

<div class="card-panel">

    <h2>Secure Add Card</h2>

    <div class="security-notice">
        <span style="font-size: 1.5rem;">✓</span>

        <div>
            <strong>Secure Card Storage</strong><br>
            Your full card number, CVV, and PIN will NOT be saved.
            Only the masked card number and last four digits are stored.
        </div>
    </div>

    <form method="POST">
        {% csrf_token %}

        <div class="form-group">
            <label>Cardholder Name</label>
            <input
                type="text"
                name="card_holder_name"
                required
                autocomplete="cc-name"
            >
        </div>

        <div class="form-group">
            <label>Card Type</label>

            <select name="card_type" required>
                <option value="">Select Card Type</option>
                <option value="CREDIT">Credit Card</option>
                <option value="DEBIT">Debit Card</option>
            </select>
        </div>

        <div class="form-group">
            <label>Card Number</label>

            <input
                type="text"
                name="card_number"
                placeholder="1234 5678 1234 5678"
                required
                autocomplete="cc-number"
            >
        </div>

        <div style="display:flex; gap:1.5rem;">

            <div class="form-group" style="flex:1;">
                <label>Expiry Date</label>

                <input
                    type="text"
                    name="expiry_date"
                    placeholder="MM/YY"
                    required
                    autocomplete="cc-exp"
                >
            </div>

            <div class="form-group" style="flex:1;">
                <label>CVV (Not saved)</label>

                <input
                    type="password"
                    name="cvv"
                    placeholder="123"
                    required
                    autocomplete="cc-csc"
                >
            </div>

        </div>

        <button
            type="submit"
            class="btn"
            style="width:100%; margin-top:1rem;"
        >
            Add Card Securely
        </button>

    </form>

</div>

{% endblock %}
